#===============================================================================
# 1. CONFIGURACIÓN GENERAL DEL PROYECTO
#===============================================================================
project:
  type: book
  output-dir: _book
  render: 
    - "*.qmd"
  resources:
    - "!images/"

#===============================================================================
# 2. METADATOS EDITORIALES Y DE PUBLICACIÓN
#===============================================================================
book:
  title: "Artesanías Intelectuales"
  subtitle: "El oficio de abrir las ciencias sociales"
  editor:
    - name: "José Omar Pérez Baños"
      affiliation: "Universidad Autónoma Metropolitana, Unidad Lerma"
      email: "correo.del.coordinador@institución.com"
      orcid: ""
  publisher: "Universidad Autónoma Metropolitana, Unidad Lerma"
  publisher-place: "Lerma de Villada, Estado de México"
  date: ""
  isbn: "978-xxx-xxx-xxx-x"
  doi: "10.xxxx/xxxxx"
  license: "CC BY-NC-SA 4.0"
  
  chapters:
    - index.qmd
    - part: ECOLOGÍAS, COMPLEJIDAD Y TERRITORIOS
      chapters:
        - capitulo_00.qmd # Artesanías intelectuales - Claudia Mosqueda
        - capitulo_01.qmd # Barbacoa - Omar Miranda e Ignacio López
        - capitulo_02.qmd # Bienestar urbano - Juan López Sauceda
        #- capitulo_03.qmd No respondió a la convocatoria
        - capitulo_05.qmd # Estrategias colectivas - Esmeralda Pliego y Emilia Lara Wlle
    - part: INTERSECCIONALIDADES DEL CUERPO, EL CUIDADO Y LA JUSTICIA
      chapters:
        - capitulo_04.qmd # Interseccionalidad en Programas Públicos Municipales - Guillermo Aldair y Ricardo astorga
        - capitulo_06.qmd # El sistema penitenciario - Daniel Yuliet Peña
        - capitulo_07.qmd # Perspectiva de género - Dora Luz Morales 
    - part: ENTREVISTA 
      chapters:
        - entrevista.qmd
    - part: RESEÑA
      chapters:
        - reseña.qmd # La sociedad del cuidado - Estela Melgarito
    - colofon.qmd

#===============================================================================
# 3. CONFIGURACIÓN DE FORMATO Y MAQUETACIÓN (PDF)
#===============================================================================
format:
  pdf:
    maketitle: false
    pdf-engine: xelatex
    lang: es
    documentclass: scrbook
    papersize: "a4"
    fontsize: 11pt
    geometry: "left=3cm,right=3cm,top=3cm,bottom=4cm"
    cite-method: biblatex
    bibliography: Libro.bib
    biblatexoptions: 
      - refsection=chapter
      - style=apa
      - isbn=false
      
    mainfont: "Cormorant Garamond"

    include-in-header: 
      - latex/preambulo.tex
      - latex/entornos.tex

    include-before-body: latex/portada.tex

    toc: true
    toc-depth: 2
    toc-title: "Índice"
    number-sections: false
    lof-title: "Índice de Figuras"
    lot-title: "Índice de Tablas"
    lof: false
    lot: false

    link-citations: true
    citecolor: "blue"
    linkcolor: "red"
    urlcolor: "green"
